# Конфигурация Supabase CLI (деплой Edge Functions).
# Документация: https://supabase.com/docs/guides/cli/config

[api]
enabled = true

[functions]
# По умолчанию JWT проверяется (пользователь должен быть залогинен).

# Cloud Code функции валидации IAP.
[functions.verifyPurchase]
verify_jwt = true

[functions.updateUserPremium]
verify_jwt = true

[functions.updateBoostStatus]
verify_jwt = true

# RTC-токен Agora (секреты: AGORA_APP_ID, AGORA_APP_CERTIFICATE).
[functions.agora-rtc-token]
verify_jwt = true
