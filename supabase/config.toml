# Конфигурация Supabase CLI (деплой Edge Functions).
# Документация: https://supabase.com/docs/guides/cli/config

[api]
enabled = true

[functions]
# По умолчанию JWT проверяется (пользователь должен быть залогинен).

# Webhook Stripe вызывается без JWT — только подпись Stripe.
[functions.stripe-webhook]
verify_jwt = false

# Оплата из приложения: проверка JWT на шлюзе отключена — иначе часто «Invalid JWT»
# из клиента при рабочей сессии. Авторизация обязательна внутри функции (auth.getUser()).
[functions.create-product-promotion]
verify_jwt = false

# Cloud Code для реальной монетизации в приложении.
[functions.activatePromotion]
verify_jwt = false

[functions.getPromotionStats]
verify_jwt = false
