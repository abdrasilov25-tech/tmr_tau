# Автодеплой Edge Functions (оплата Stripe) при пуше в main.
# Нужные секреты репозитория: см. .github/SECRETS.md
name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      # Убираем пробелы/переносы из Secrets (частая причина «Invalid project ref format»).
      # Если случайно вставили URL — вытаскиваем id после /project/.
      - name: Sanitize Supabase env
        run: |
          set -e
          RAW="$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')"
          if printf '%s' "$RAW" | grep -qE 'supabase\.com/.*project/'; then
            REF="$(printf '%s' "$RAW" | sed -n 's|.*/project/\([^/?#]*\).*|\1|p')"
          else
            REF="$(printf '%s' "$RAW" | tr -d '"' | tr -d "'")"
          fi
          REF="$(printf '%s' "$REF" | tr '[:upper:]' '[:lower:]')"
          TOK="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')"
          if [ -z "$REF" ] || [ -z "$TOK" ]; then
            echo "::error::Проверь Secrets: SUPABASE_PROJECT_REF и SUPABASE_ACCESS_TOKEN не должны быть пустыми."
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -qE '^[a-z0-9]{15,}$'; then
            echo "::error::SUPABASE_PROJECT_REF: только id проекта из URL (латиница/цифры), без https. Длина сейчас: ${#REF}"
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$REF" >> "$GITHUB_ENV"
          echo "SUPABASE_ACCESS_TOKEN=$TOK" >> "$GITHUB_ENV"
          echo "OK: project ref length ${#REF}"

      # Бинарник с GitHub — без supabase/setup-cli. Распаковка в /tmp: в репо уже есть папка `supabase/`,
      # иначе tar пытается создать файл `supabase` в корне и падает с "File exists".
      - name: Install Supabase CLI
        run: |
          set -e
          mkdir -p /tmp/supabase-cli
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            -o /tmp/supabase-cli/bin.tgz
          tar -xzf /tmp/supabase-cli/bin.tgz -C /tmp/supabase-cli
          sudo install -m 755 /tmp/supabase-cli/supabase /usr/local/bin/supabase
          supabase --version

      - name: Deploy Edge Functions
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Добавь в GitHub → Settings → Secrets: SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF"
            echo "См. .github/SECRETS.md"
            exit 1
          fi
          # Один вызов — деплой всех функций из supabase/functions/
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      # Опционально: синхронизация Stripe в Supabase Secrets (не валит весь job при ошибке CLI)
      - name: Sync payment secrets to Supabase (optional)
        continue-on-error: true
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        run: |
          supabase --version
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "STRIPE_SECRET_KEY не задан — шаг пропущен."
            exit 0
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET"
          fi
          if [ -n "${PUBLIC_APP_URL:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" PUBLIC_APP_URL="$PUBLIC_APP_URL"
          fi
