# Автодеплой Edge Functions (оплата Stripe) при пуше в main.
# Нужные секреты репозитория: см. .github/SECRETS.md
name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      # Официальный action — надёжнее, чем npm install -g supabase (частая причина красных крестиков).
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Добавь в GitHub → Settings → Secrets: SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF"
            echo "См. .github/SECRETS.md"
            exit 1
          fi
          # Один вызов — деплой всех функций из supabase/functions/
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      # Опционально: синхронизация Stripe в Supabase Secrets (не валит весь job при ошибке CLI)
      - name: Sync payment secrets to Supabase (optional)
        continue-on-error: true
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        run: |
          supabase --version
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "STRIPE_SECRET_KEY не задан — шаг пропущен."
            exit 0
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET"
          fi
          if [ -n "${PUBLIC_APP_URL:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" PUBLIC_APP_URL="$PUBLIC_APP_URL"
          fi
