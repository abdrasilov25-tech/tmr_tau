# Автодеплой Edge Functions (оплата Stripe) при пуше в main.
# Нужные секреты репозитория: см. .github/SECRETS.md
name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy Edge Functions
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Добавь в GitHub → Settings → Secrets: SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF"
            echo "См. .github/SECRETS.md"
            exit 1
          fi
          supabase functions deploy create-product-promotion --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF"

      # Опционально: если в GitHub заданы STRIPE_* / PUBLIC_APP_URL — пушим в Supabase Secrets
      - name: Sync payment secrets to Supabase (optional)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        run: |
          set -e
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "STRIPE_SECRET_KEY не задан в GitHub Secrets — шаг пропущен (задай ключи в Supabase вручную)."
            exit 0
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}"
          fi
          if [ -n "${PUBLIC_APP_URL:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "PUBLIC_APP_URL=${PUBLIC_APP_URL}"
          fi
