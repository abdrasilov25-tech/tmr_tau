# Blocks accidental commit of Google Maps-style API keys (AIzaSy...).
name: Secret scan (Google Maps key)

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  no-maps-api-key-in-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AIzaSy key in tracked files
        run: bash scripts/check_no_google_maps_keys_in_repo.sh
